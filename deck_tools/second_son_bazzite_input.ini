# Keyboard bindings. Repeated output names are intentional: shadPS4 parses each line into an
# additive BindingConnection, matching GetDefaultInputConfig() in src/input/input_handler.cpp.
triangle = kp8
circle = kp6
cross = kp2
square = kp4
triangle = c
circle = b
cross = n
square = v
l1 = q
r1 = u
l2 = e
r2 = o
l3 = x
r3 = m
options = enter
touchpad_center = space
pad_up = up
pad_down = down
pad_left = left
pad_right = right
axis_left_x_minus = a
axis_left_x_plus = d
axis_left_y_minus = w
axis_left_y_plus = s
axis_right_x_minus = j
axis_right_x_plus = l
axis_right_y_minus = i
axis_right_y_plus = k

# Standard SDL/Xbox controller bindings
triangle = triangle
cross = cross
square = square
circle = circle
l1 = l1
l2 = l2
l3 = l3
r1 = r1
r2 = r2
r3 = r3
options = options
touchpad_center = back
pad_up = pad_up
pad_down = pad_down
pad_left = pad_left
pad_right = pad_right
axis_left_x = axis_left_x
axis_left_y = axis_left_y
axis_right_x = axis_right_x
axis_right_y = axis_right_y

# One press turns the controller, shakes the can, holds R2, sweeps the stencil,
# releases R2, and restores raw controls.
controller_spray_assist = l3, r3

# Hold View/Back and tap a D-pad direction to emit a complete touchpad swipe.
controller_touchpad_swipe_up = back, pad_up
controller_touchpad_swipe_down = back, pad_down
controller_touchpad_swipe_left = back, pad_left
controller_touchpad_swipe_right = back, pad_right

analog_deadzone = leftjoystick, 5, 127
analog_deadzone = rightjoystick, 5, 127
override_controller_color = false, 0, 0, 255
