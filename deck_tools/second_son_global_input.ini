# Steam Deck motion helpers for games that require a DualShock pose.
# Hold L4 or R4 for either sideways orientation. Hold L5 to emulate a shake.
controller_sideways_left = lpaddle_high
controller_sideways_right = rpaddle_high
controller_shake = lpaddle_low

# Keyboard equivalents used by the automated Gamescope checks.
controller_sideways_left = lshift
controller_sideways_right = rshift
controller_shake = lctrl
