# Steam Deck motion helpers for games that require a DualShock pose.
# Hold L4 or R4 for either sideways orientation. Hold L5 to emulate a shake.
controller_sideways_left = lpaddle_high
controller_sideways_right = rpaddle_high
controller_shake = lpaddle_low

# Keyboard equivalents used by the automated Gamescope checks.
controller_sideways_left = lshift
controller_sideways_right = rshift
controller_shake = lctrl

# Xbox-style pads have no touch surface. Hold View/Back and tap a D-pad direction to emit a
# complete touch gesture in that direction. Longer chords win over the normal View and D-pad
# bindings, so the game receives the swipe instead of both underlying buttons.
controller_touchpad_swipe_up = back, pad_up
controller_touchpad_swipe_down = back, pad_down
controller_touchpad_swipe_left = back, pad_left
controller_touchpad_swipe_right = back, pad_right
